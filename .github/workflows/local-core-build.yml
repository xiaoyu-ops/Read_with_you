name: Build local Pet Core

on:
  pull_request:
    paths:
      - ".github/workflows/local-core-build.yml"
      - "backend/**"
      - "config/**"
      - "frontend/**"
      - "scripts/build_local_core_bundle.py"
      - "scripts/peinidu_local_core.py"
  workflow_dispatch:
    inputs:
      version:
        description: Version label written to the release manifest
        required: true
        default: 0.1.0-dev

permissions:
  contents: read

env:
  PEINIDU_BUILD_VERSION: ${{ inputs.version || '0.1.0-dev' }}

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.10

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python build dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-local-core.txt pyinstaller==6.16.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install pinned Poppler on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          conda create --yes --quiet --prefix "$RUNNER_TEMP/peinidu-poppler" --channel conda-forge poppler=24.08.0
          echo "PEINIDU_POPPLER_BIN=$RUNNER_TEMP/peinidu-poppler/bin" >> "$GITHUB_ENV"

      - name: Install pinned Poppler on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/oschwartz10612/poppler-windows/releases/download/v24.08.0-0/Release-24.08.0-0.zip"
          $archive = Join-Path $env:RUNNER_TEMP "poppler.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expected = "58a6f9ae269756231d2f9aa6cba39d75fec6deacaf3c4a50683383b5f3d5a527"
          if ($actual -ne $expected) { throw "Poppler archive checksum mismatch" }
          $target = Join-Path $env:RUNNER_TEMP "peinidu-poppler"
          Expand-Archive -Path $archive -DestinationPath $target
          $binary = Get-ChildItem -Path $target -Filter pdftotext.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw "pdftotext.exe missing from Poppler archive" }
          "PEINIDU_POPPLER_BIN=$($binary.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set deterministic build timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct)" >> "$GITHUB_ENV"

      - name: Run packaging contract tests
        run: python -m unittest backend.tests.test_local_core_packaging backend.tests.test_local_core_launcher backend.tests.test_local_core_gateway

      - name: Build credential-free local Core bundle
        shell: bash
        run: >-
          python scripts/build_local_core_bundle.py
          --version "$PEINIDU_BUILD_VERSION"
          --node "$(node -p 'process.execPath')"
          --poppler-bin "$PEINIDU_POPPLER_BIN"

      - name: Verify candidate remains private and untrusted
        shell: bash
        run: >-
          python -c
          "import glob,json;
          paths=glob.glob('dist/local-core/*.manifest.json');
          assert len(paths)==1, paths;
          data=json.load(open(paths[0], encoding='utf-8'));
          assert data['signed'] is False and data['notarized'] is False"

      - uses: actions/upload-artifact@v4
        with:
          name: peinidu-local-core-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/local-core/*.dmg
            dist/local-core/*.zip
            dist/local-core/*.sha256
            dist/local-core/*.manifest.json
            dist/local-core/*THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
