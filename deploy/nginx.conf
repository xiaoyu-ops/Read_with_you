server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # The PDF sidecar calls this route only over the private Compose network.
    # Never expose provider mediation through the public /api proxy.
    location ^~ /api/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite untrusted client input; the backend reads this single value
        # only when the socket peer is explicitly configured as trusted.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location /assets/ {
        proxy_pass http://backend:8000/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
