# Public portal only. The full Pet Core must remain loopback-local.
server {
    listen 80;
    listen 8080;
    include /etc/nginx/snippets/cloudflare-origin-only.conf;
    server_name pet.xiaoyu666.cyou;

    access_log off;
    return 308 https://readwithyou.xiaoyu666.cyou$request_uri;
}

server {
    listen 80;
    listen 8080;
    include /etc/nginx/snippets/cloudflare-origin-only.conf;
    server_name readwithyou.xiaoyu666.cyou;

    access_log off;
    client_max_body_size 4k;

    location / {
        proxy_pass http://127.0.0.1:8540;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
